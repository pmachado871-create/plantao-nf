name: Gerar texturas (OpenAI)
on:
  push:
    paths: ['texturas/rodar.txt']
  workflow_dispatch:
    inputs:
      modelo:
        description: 'Modelo de imagem'
        required: false
        default: 'gpt-image-1.5'
      qualidade:
        description: 'low, medium ou high'
        required: false
        default: 'medium'
permissions:
  contents: write
concurrency: texturas
jobs:
  texturas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Gerar imagens que ainda faltam
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI }}
          MODELO: ${{ github.event.inputs.modelo }}
          QUALIDADE: ${{ github.event.inputs.qualidade }}
        run: python3 texturas/gera.py
      - name: Salvar no repositório
        run: |
          git config user.name "robo-texturas"
          git config user.email "robo-texturas@users.noreply.github.com"
          git add texturas/png texturas/log.txt || true
          git diff --cached --quiet || git commit -m "Texturas geradas pela OpenAI"
          git pull --rebase -q || true
          git push
